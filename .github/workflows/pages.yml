# Publishes the Brand Check page (web/static) to GitHub Pages.
# Without the Python server the page runs its free mode entirely in the browser (engine.js).
name: Deploy Brand Check to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Pages tells browsers to cache files for 10 minutes; a version in the URLs makes every
      # deploy load fresh CSS/JS instead of an old copy.
      - name: Version asset URLs
        run: sed -i -E "s/(styles\.css|i18n\.js|engine\.js|app\.js)\"/\1?v=${GITHUB_SHA::7}\"/g" web/static/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/static
      - id: deployment
        uses: actions/deploy-pages@v4
